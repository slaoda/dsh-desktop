name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Validate release tag and changelog
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e "const p=require('./package.json'); if (process.env.RELEASE_TAG !== 'v'+p.version) throw new Error('Git tag must equal v'+p.version)"
          node scripts/extract-changelog.mjs "$env:RELEASE_TAG" CHANGELOG.md > $null

  package:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: verify
    timeout-minutes: 45
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test
      - run: npm run package:win:x64
      - run: npm run test:packaged
      - name: Upload build artifacts (primary)
        id: upload-artifacts-v4
        uses: actions/upload-artifact@v7
        with:
          name: dsh-desktop-windows-x64
          path: |
            release/*.exe
            release/SHA256SUMS-win32-x64
            release/*-sbom.cdx.json
            release/THIRD-PARTY-LICENSES.txt
          if-no-files-found: error
      - name: Upload build artifacts (retry)
        if: failure() && steps.upload-artifacts-v4.outcome == 'failure'
        id: upload-artifacts-v4-retry
        uses: actions/upload-artifact@v7
        with:
          name: dsh-desktop-windows-x64
          path: |
            release/*.exe
            release/SHA256SUMS-win32-x64
            release/*-sbom.cdx.json
            release/THIRD-PARTY-LICENSES.txt
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, package]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Verify tag matches application version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node scripts/version.mjs check
          node -e "const p=require('./package.json'); if (process.env.RELEASE_TAG !== 'v'+p.version) throw new Error('Git tag must equal v'+p.version)"
      - name: Extract release notes from CHANGELOG.md
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/extract-changelog.mjs "$RELEASE_TAG" CHANGELOG.md > release-notes.md
      - uses: actions/download-artifact@v8
        with:
          pattern: dsh-desktop-*
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          name: DSH Desktop ${{ github.ref_name }}
          body_path: release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          overwrite_files: true
          files: |
            release/*.exe
            release/SHA256SUMS-win32-x64
            release/*-sbom.cdx.json
            release/THIRD-PARTY-LICENSES.txt
